
services:
  flask:
    image: ${FLASK_IMAGE}
    ports:
      - target: 5000
        published: 5005
        protocol: tcp
        mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - red_compartida
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == instance-20260930-1814
      restart_policy:
        condition: on-failure

networks:
  red_compartida:
    external: true
    name: examen_red_examen
